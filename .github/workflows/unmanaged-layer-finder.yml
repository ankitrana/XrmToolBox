name: Unmanaged Layer Finder

# Builds only when this plugin (or this workflow) changes
on:
  push:
    branches: [main]
    paths:
      - "UnmanagedLayerFinder/**"
      - ".github/workflows/unmanaged-layer-finder.yml"
  pull_request:
    branches: [main]
    paths:
      - "UnmanagedLayerFinder/**"
      - ".github/workflows/unmanaged-layer-finder.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build UnmanagedLayerFinder/src/UnmanagedLayerFinder/UnmanagedLayerFinder.csproj -c Release

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: UnmanagedLayerFinder
          path: UnmanagedLayerFinder/src/UnmanagedLayerFinder/bin/Release/UnmanagedLayerFinder.dll
