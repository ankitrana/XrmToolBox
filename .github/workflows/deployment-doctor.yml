name: Deployment Doctor

# Builds only when this plugin (or this workflow) changes
on:
  push:
    branches: [main]
    paths:
      - "DeploymentDoctor/**"
      - ".github/workflows/deployment-doctor.yml"
  pull_request:
    branches: [main]
    paths:
      - "DeploymentDoctor/**"
      - ".github/workflows/deployment-doctor.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build DeploymentDoctor/src/DeploymentDoctor/DeploymentDoctor.csproj -c Release

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: DeploymentDoctor
          path: DeploymentDoctor/src/DeploymentDoctor/bin/Release/DeploymentDoctor.dll
