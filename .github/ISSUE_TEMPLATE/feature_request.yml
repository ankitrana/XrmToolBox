name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - Unmanaged Layer Finder
        - Deployment Doctor
        - Idea for a new tool
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your ALM / deployment / admin process.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like the tool to help?
    validations:
      required: true
